; Oficina de ESP32 — PETECO / UTFPR
; Projeto PlatformIO. Abra ESTA pasta no VS Code (File → Open Folder).
;
; pioarduino = core Arduino-ESP32 3.x, o mesmo usado nos slides.
; A plataforma oficial "espressif32" ainda vem com o core 2.x.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino

; LittleFS precisa de uma partição de dados na flash. A tabela padrão da
; esp32dev já reserva uma (é o "Default 4MB with spiffs" da Arduino IDE).
board_build.partitions = default.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; upload_speed = 115200   ; descomente se a gravação falhar no meio
