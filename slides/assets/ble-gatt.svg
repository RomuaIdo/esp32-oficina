<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="30" y="30" fill="#14161a" font-size="18" font-weight="700">GATT &#8212; a placa publica um cardápio, o celular escolhe</text>

  <!-- ===== Servidor ===== -->
  <rect x="30" y="58" width="380" height="330" rx="10" fill="#14161a"/>
  <text x="220" y="90" text-anchor="middle" fill="#f5c400" font-size="17" font-weight="700">ESP32 &#183; servidor GATT</text>
  <text x="220" y="112" text-anchor="middle" fill="#8b93a1" font-size="12">anuncia o nome &#8220;PETECO-b1&#8221;</text>

  <!-- Servico -->
  <rect x="54" y="130" width="332" height="238" rx="8" fill="#2a2e37" stroke="#f5c400" stroke-width="2"/>
  <text x="74" y="156" fill="#f5c400" font-size="14" font-weight="700">SERVIÇO &#183; Ambiente</text>
  <text x="74" y="176" fill="#8b93a1" font-size="11">UUID 181A</text>

  <!-- Caracteristica 1 -->
  <rect x="74" y="190" width="292" height="78" rx="6" fill="#14161a" stroke="#5b6270" stroke-width="1.5"/>
  <text x="92" y="214" fill="#ffffff" font-size="14" font-weight="700">CARACTERÍSTICA &#183; temperatura</text>
  <text x="92" y="234" fill="#8b93a1" font-size="11">UUID 2A6E &#183; valor: 23.5</text>
  <rect x="92" y="243" width="58" height="19" rx="4" fill="#1f8a4c"/>
  <text x="121" y="257" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">READ</text>
  <rect x="158" y="243" width="70" height="19" rx="4" fill="#1f8a4c"/>
  <text x="193" y="257" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">NOTIFY</text>

  <!-- Caracteristica 2 -->
  <rect x="74" y="280" width="292" height="72" rx="6" fill="#14161a" stroke="#5b6270" stroke-width="1.5"/>
  <text x="92" y="304" fill="#ffffff" font-size="14" font-weight="700">CARACTERÍSTICA &#183; LED</text>
  <text x="92" y="324" fill="#8b93a1" font-size="11">UUID personalizado &#183; valor: 0</text>
  <rect x="92" y="331" width="58" height="19" rx="4" fill="#8a6d00"/>
  <text x="121" y="345" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">WRITE</text>

  <!-- ===== Setas ===== -->
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f8a4c"/>
    </marker>
    <marker id="gb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d00"/>
    </marker>
  </defs>

  <path d="M414 228 H 586" fill="none" stroke="#1f8a4c" stroke-width="2.5" marker-end="url(#ga)"/>
  <text x="500" y="220" text-anchor="middle" fill="#1f8a4c" font-size="12" font-weight="700">notify: 23.5</text>

  <path d="M586 316 H 414" fill="none" stroke="#8a6d00" stroke-width="2.5" marker-end="url(#gb)"/>
  <text x="500" y="308" text-anchor="middle" fill="#8a6d00" font-size="12" font-weight="700">write: 1</text>

  <!-- ===== Cliente ===== -->
  <rect x="590" y="110" width="200" height="256" rx="14" fill="#ffffff" stroke="#14161a" stroke-width="3"/>
  <rect x="590" y="110" width="200" height="34" rx="14" fill="#14161a"/>
  <text x="690" y="133" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">celular &#183; cliente</text>

  <text x="690" y="176" text-anchor="middle" fill="#5b6270" font-size="12">app nRF Connect</text>

  <rect x="610" y="196" width="160" height="56" rx="7" fill="#f7f8fa" stroke="#c9cdd6" stroke-width="2"/>
  <text x="690" y="218" text-anchor="middle" fill="#5b6270" font-size="11">temperatura</text>
  <text x="690" y="240" text-anchor="middle" fill="#14161a" font-size="20" font-weight="800">23.5 &#176;C</text>

  <rect x="610" y="288" width="160" height="46" rx="7" fill="#f5c400"/>
  <text x="690" y="317" text-anchor="middle" fill="#14161a" font-size="14" font-weight="700">LIGAR LED</text>

  <text x="30" y="418" fill="#5b6270" font-size="14">O celular descobre tudo sozinho ao conectar: não precisa saber nada da placa de antemão, só o UUID do serviço.</text>
</svg>
