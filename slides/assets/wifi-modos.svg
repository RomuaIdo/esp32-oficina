<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="30" y="30" fill="#14161a" font-size="18" font-weight="700">Os três modos de Wi-Fi</text>

  <defs>
    <marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6270"/>
    </marker>
  </defs>

  <!-- ================= STA ================= -->
  <rect x="24" y="56" width="262" height="290" rx="10" fill="#f7f8fa" stroke="#c9cdd6" stroke-width="2"/>
  <text x="155" y="84" text-anchor="middle" fill="#14161a" font-size="17" font-weight="700">WIFI_STA</text>
  <text x="155" y="104" text-anchor="middle" fill="#5b6270" font-size="13">a placa entra numa rede</text>

  <rect x="104" y="124" width="102" height="48" rx="7" fill="#ffffff" stroke="#14161a" stroke-width="2.5"/>
  <text x="155" y="154" text-anchor="middle" fill="#14161a" font-size="14" font-weight="700">roteador</text>

  <path d="M155 172 V 214" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#st)"/>

  <rect x="104" y="218" width="102" height="48" rx="7" fill="#14161a"/>
  <text x="155" y="248" text-anchor="middle" fill="#f5c400" font-size="14" font-weight="700">ESP32</text>

  <text x="155" y="294" text-anchor="middle" fill="#1f8a4c" font-size="13" font-weight="700">tem internet</text>
  <text x="155" y="316" text-anchor="middle" fill="#5b6270" font-size="12">IP vem do roteador</text>
  <text x="155" y="334" text-anchor="middle" fill="#5b6270" font-size="12">precisa da rede existir</text>

  <!-- ================= AP ================= -->
  <rect x="308" y="56" width="262" height="290" rx="10" fill="#fffbe8" stroke="#f5c400" stroke-width="2.5"/>
  <text x="439" y="84" text-anchor="middle" fill="#14161a" font-size="17" font-weight="700">WIFI_AP</text>
  <text x="439" y="104" text-anchor="middle" fill="#5b6270" font-size="13">a placa vira a rede</text>

  <rect x="388" y="124" width="102" height="48" rx="7" fill="#14161a"/>
  <text x="439" y="154" text-anchor="middle" fill="#f5c400" font-size="14" font-weight="700">ESP32</text>

  <path d="M404 172 V 214" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#st)"/>
  <path d="M474 172 V 214" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#st)"/>

  <rect x="352" y="218" width="94" height="48" rx="7" fill="#ffffff" stroke="#14161a" stroke-width="2.5"/>
  <text x="399" y="248" text-anchor="middle" fill="#14161a" font-size="13" font-weight="700">celular</text>
  <rect x="456" y="218" width="94" height="48" rx="7" fill="#ffffff" stroke="#14161a" stroke-width="2.5"/>
  <text x="503" y="248" text-anchor="middle" fill="#14161a" font-size="13" font-weight="700">notebook</text>

  <text x="439" y="294" text-anchor="middle" fill="#c8102e" font-size="13" font-weight="700">sem internet</text>
  <text x="439" y="316" text-anchor="middle" fill="#5b6270" font-size="12">IP fixo: 192.168.4.1</text>
  <text x="439" y="334" text-anchor="middle" fill="#5b6270" font-size="12">funciona em qualquer lugar</text>

  <!-- ================= AP_STA ================= -->
  <rect x="592" y="56" width="262" height="290" rx="10" fill="#e7f9ef" stroke="#1f8a4c" stroke-width="2.5"/>
  <text x="723" y="84" text-anchor="middle" fill="#14161a" font-size="17" font-weight="700">WIFI_AP_STA</text>
  <text x="723" y="104" text-anchor="middle" fill="#5b6270" font-size="13">os dois ao mesmo tempo</text>

  <rect x="672" y="124" width="102" height="44" rx="7" fill="#ffffff" stroke="#14161a" stroke-width="2.5"/>
  <text x="723" y="152" text-anchor="middle" fill="#14161a" font-size="13" font-weight="700">roteador</text>

  <path d="M723 168 V 198" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#st)"/>

  <rect x="672" y="202" width="102" height="44" rx="7" fill="#14161a"/>
  <text x="723" y="230" text-anchor="middle" fill="#f5c400" font-size="13" font-weight="700">ESP32</text>

  <path d="M723 246 V 272" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#st)"/>

  <rect x="672" y="276" width="102" height="40" rx="7" fill="#ffffff" stroke="#14161a" stroke-width="2.5"/>
  <text x="723" y="302" text-anchor="middle" fill="#14161a" font-size="13" font-weight="700">celular</text>

  <text x="723" y="336" text-anchor="middle" fill="#5b6270" font-size="12">usado na configuração inicial</text>

  <text x="30" y="378" fill="#5b6270" font-size="14">Na banca, o modo AP é o seguro: não depende da rede da universidade nem de senha que você não controla.</text>
</svg>
