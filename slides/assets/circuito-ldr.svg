<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>

  <!-- Placa ESP32 -->
  <rect x="40" y="60" width="180" height="230" rx="10" fill="#14161a"/>
  <text x="130" y="105" text-anchor="middle" fill="#f5c400" font-size="21" font-weight="700">ESP32</text>
  <text x="130" y="128" text-anchor="middle" fill="#8b93a1" font-size="13">DevKit WROOM-32</text>

  <!-- Pinos -->
  <rect x="212" y="164" width="16" height="10" fill="#f5c400"/>
  <rect x="212" y="224" width="16" height="10" fill="#f5c400"/>
  <rect x="212" y="269" width="16" height="10" fill="#f5c400"/>
  <text x="204" y="173" text-anchor="end" fill="#ffffff" font-size="15" font-weight="600">3V3</text>
  <text x="204" y="233" text-anchor="end" fill="#ffffff" font-size="15" font-weight="600">GPIO 34</text>
  <text x="204" y="278" text-anchor="end" fill="#ffffff" font-size="15" font-weight="600">GND</text>

  <!-- Fios -->
  <g stroke="#14161a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M228 169 H 420"/>
    <path d="M228 229 H 420"/>
    <path d="M228 274 H 420"/>
    <path d="M420 169 V 184"/>
    <path d="M420 229 V 244"/>
  </g>

  <!-- LDR (entre 3V3 e o nó de leitura) -->
  <rect x="396" y="184" width="48" height="36" rx="4" fill="#ffffff" stroke="#14161a" stroke-width="3"/>
  <path d="M404 202 l 6 -8 6 16 6 -16 6 16 6 -8" fill="none" stroke="#14161a" stroke-width="2"/>
  <!-- setas indicando incidência de luz -->
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8102e"/>
    </marker>
  </defs>
  <g stroke="#c8102e" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#seta)">
    <path d="M384 166 L 400 182"/>
    <path d="M384 190 L 400 206"/>
  </g>
  <text x="474" y="196" fill="#14161a" font-size="16" font-weight="700">LDR</text>
  <text x="474" y="216" fill="#5b6270" font-size="13">fotorresistor</text>

  <!-- Resistor 10k (do nó para o GND) -->
  <rect x="396" y="244" width="48" height="36" rx="4" fill="#ffffff" stroke="#14161a" stroke-width="3"/>
  <text x="474" y="258" fill="#14161a" font-size="16" font-weight="700">10 k&#8486;</text>
  <text x="474" y="278" fill="#5b6270" font-size="13">resistor fixo</text>

  <!-- Nó de leitura -->
  <circle cx="420" cy="229" r="6" fill="#14161a"/>
  <text x="392" y="252" text-anchor="end" fill="#1f8a4c" font-size="14" font-weight="700">nó de leitura</text>

  <!-- Legenda -->
  <text x="40" y="318" fill="#5b6270" font-size="14">Divisor de tensão: mais luz &#8594; menor resistência do LDR &#8594; maior tensão no GPIO 34.</text>
  <text x="40" y="36" fill="#14161a" font-size="18" font-weight="700">Leitura de luminosidade &#8212; LDR no ADC1</text>
</svg>
