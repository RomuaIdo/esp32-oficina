<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="30" y="30" fill="#14161a" font-size="18" font-weight="700">Fila: quem produz não espera quem consome</text>

  <defs>
    <marker id="pta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14161a"/>
    </marker>
  </defs>

  <!-- ===== Produtor ===== -->
  <rect x="30" y="78" width="210" height="118" rx="10" fill="#14161a"/>
  <text x="135" y="108" text-anchor="middle" fill="#f5c400" font-size="16" font-weight="700">tarefaSensor</text>
  <text x="135" y="132" text-anchor="middle" fill="#8b93a1" font-size="13">lê o sensor a 10 Hz</text>
  <text x="135" y="158" text-anchor="middle" fill="#ffffff" font-size="13">xQueueSend(...)</text>
  <text x="135" y="180" text-anchor="middle" fill="#8b93a1" font-size="12">rápida, nunca bloqueia</text>

  <!-- ===== ISR ===== -->
  <rect x="30" y="232" width="210" height="104" rx="10" fill="#ffffff" stroke="#c8102e" stroke-width="2.5"/>
  <text x="135" y="262" text-anchor="middle" fill="#c8102e" font-size="16" font-weight="700">ISR do botão</text>
  <text x="135" y="286" text-anchor="middle" fill="#14161a" font-size="13">xQueueSendFromISR</text>
  <text x="135" y="310" text-anchor="middle" fill="#5b6270" font-size="12">versão “FromISR”,</text>
  <text x="135" y="326" text-anchor="middle" fill="#5b6270" font-size="12">obrigatória aqui</text>

  <!-- ===== Fila ===== -->
  <text x="440" y="100" text-anchor="middle" fill="#14161a" font-size="16" font-weight="700">fila</text>
  <text x="440" y="120" text-anchor="middle" fill="#5b6270" font-size="12">xQueueCreate(10, sizeof(Leitura))</text>

  <g stroke="#14161a" stroke-width="2.5" fill="none">
    <rect x="330" y="136" width="222" height="54" rx="6" fill="#f7f8fa"/>
  </g>
  <g>
    <rect x="334" y="146" width="38" height="34" rx="4" fill="#f5c400"/>
    <rect x="378" y="146" width="38" height="34" rx="4" fill="#f5c400"/>
    <rect x="422" y="146" width="38" height="34" rx="4" fill="#f5c400"/>
    <rect x="466" y="146" width="38" height="34" rx="4" fill="#ffffff" stroke="#c9cdd6" stroke-width="2"/>
    <rect x="510" y="146" width="38" height="34" rx="4" fill="#ffffff" stroke="#c9cdd6" stroke-width="2"/>
  </g>
  <text x="440" y="212" text-anchor="middle" fill="#5b6270" font-size="12">3 itens esperando &#183; capacidade 10</text>

  <!-- setas para a fila -->
  <path d="M240 137 H 300 V 150 H 326" fill="none" stroke="#14161a" stroke-width="2.5" marker-end="url(#pta)"/>
  <path d="M240 284 H 300 V 176 H 326" fill="none" stroke="#c8102e" stroke-width="2.5" marker-end="url(#pta)"/>

  <!-- ===== Consumidor ===== -->
  <rect x="640" y="108" width="210" height="118" rx="10" fill="#14161a"/>
  <text x="745" y="138" text-anchor="middle" fill="#f5c400" font-size="16" font-weight="700">tarefaGravacao</text>
  <text x="745" y="162" text-anchor="middle" fill="#ffffff" font-size="13">xQueueReceive(...)</text>
  <text x="745" y="186" text-anchor="middle" fill="#8b93a1" font-size="12">grava no LittleFS</text>
  <text x="745" y="208" text-anchor="middle" fill="#8b93a1" font-size="12">pode demorar à vontade</text>

  <path d="M556 163 H 636" fill="none" stroke="#14161a" stroke-width="2.5" marker-end="url(#pta)"/>

  <!-- ===== Nota sobre o bloqueio ===== -->
  <rect x="330" y="248" width="520" height="92" rx="8" fill="#f7f8fa" stroke="#c9cdd6" stroke-width="2"/>
  <text x="350" y="276" fill="#14161a" font-size="14" font-weight="700">Enquanto a fila está vazia…</text>
  <text x="350" y="300" fill="#5b6270" font-size="13">a tarefaGravacao fica bloqueada em xQueueReceive e <tspan font-weight="700" fill="#1f8a4c">não gasta CPU</tspan>.</text>
  <text x="350" y="322" fill="#5b6270" font-size="13">O escalonador acorda ela sozinho assim que chegar um item.</text>

  <text x="30" y="380" fill="#5b6270" font-size="14">A fila copia o dado e já resolve a exclusão mútua: nenhum lado precisa de variável global nem de flag.</text>
  <text x="30" y="402" fill="#5b6270" font-size="14">Se a gravação travar por meio segundo, as leituras se acumulam na fila em vez de se perderem.</text>
</svg>
