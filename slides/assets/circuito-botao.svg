<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect width="700" height="370" fill="#ffffff"/>

  <text x="40" y="36" fill="#14161a" font-size="18" font-weight="700">Botão com pull-up externo &#8212; entrada por interrupção</text>

  <!-- Placa ESP32 -->
  <rect x="40" y="60" width="180" height="248" rx="10" fill="#14161a"/>
  <text x="130" y="105" text-anchor="middle" fill="#f5c400" font-size="21" font-weight="700">ESP32</text>
  <text x="130" y="128" text-anchor="middle" fill="#8b93a1" font-size="13">DevKit WROOM-32</text>

  <rect x="212" y="164" width="16" height="10" fill="#f5c400"/>
  <rect x="212" y="224" width="16" height="10" fill="#f5c400"/>
  <rect x="212" y="284" width="16" height="10" fill="#f5c400"/>
  <text x="204" y="173" text-anchor="end" fill="#ffffff" font-size="15" font-weight="600">3V3</text>
  <text x="204" y="233" text-anchor="end" fill="#ffffff" font-size="15" font-weight="600">GPIO 4</text>
  <text x="204" y="293" text-anchor="end" fill="#ffffff" font-size="15" font-weight="600">GND</text>

  <!-- Fios -->
  <g stroke="#14161a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M228 169 H 420"/>
    <path d="M228 229 H 420"/>
    <path d="M228 289 H 420"/>
    <path d="M420 169 V 184"/>
    <path d="M420 229 V 252"/>
    <path d="M420 289 V 280"/>
  </g>

  <!-- Resistor de pull-up -->
  <rect x="396" y="184" width="48" height="36" rx="4" fill="#ffffff" stroke="#14161a" stroke-width="3"/>
  <text x="474" y="198" fill="#14161a" font-size="16" font-weight="700">10 k&#8486;</text>
  <text x="474" y="218" fill="#5b6270" font-size="13">resistor de pull-up</text>

  <!-- Botão (chave normalmente aberta) -->
  <circle cx="420" cy="252" r="5" fill="#14161a"/>
  <circle cx="420" cy="280" r="5" fill="#14161a"/>
  <path d="M420 280 L 452 250" stroke="#14161a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M436 265 L 448 277" stroke="#14161a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="474" y="262" fill="#14161a" font-size="16" font-weight="700">Push button</text>
  <text x="474" y="282" fill="#5b6270" font-size="13">fecha o circuito para o GND</text>

  <!-- Nó de leitura -->
  <circle cx="420" cy="229" r="6" fill="#14161a"/>
  <text x="392" y="252" text-anchor="end" fill="#1f8a4c" font-size="14" font-weight="700">nó de leitura</text>

  <text x="40" y="340" fill="#5b6270" font-size="14">Solto: o pino lê 3,3 V (HIGH). Pressionado: liga ao GND e lê 0 V (LOW).</text>
  <text x="40" y="358" fill="#5b6270" font-size="14">Como a borda útil é a de descida, a interrupção é registrada em FALLING.</text>
</svg>
