<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="30" y="30" fill="#14161a" font-size="18" font-weight="700">I2C &#8212; dois fios, vários dispositivos, um endereço para cada</text>

  <!-- Mestre -->
  <rect x="30" y="118" width="150" height="150" rx="10" fill="#14161a"/>
  <text x="105" y="166" text-anchor="middle" fill="#f5c400" font-size="18" font-weight="700">ESP32</text>
  <text x="105" y="188" text-anchor="middle" fill="#8b93a1" font-size="13">mestre</text>
  <text x="105" y="214" text-anchor="middle" fill="#ffffff" font-size="13">GPIO 21 &#183; SDA</text>
  <text x="105" y="234" text-anchor="middle" fill="#ffffff" font-size="13">GPIO 22 &#183; SCL</text>

  <!-- Linhas do barramento -->
  <line x1="180" y1="150" x2="820" y2="150" stroke="#14161a" stroke-width="3"/>
  <line x1="180" y1="186" x2="820" y2="186" stroke="#14161a" stroke-width="3"/>
  <text x="196" y="142" fill="#14161a" font-size="14" font-weight="700">SDA</text>
  <text x="196" y="178" fill="#14161a" font-size="14" font-weight="700">SCL</text>

  <!-- Pull-ups -->
  <line x1="300" y1="66" x2="820" y2="66" stroke="#c8102e" stroke-width="2.5"/>
  <text x="828" y="70" fill="#c8102e" font-size="13" font-weight="700">3V3</text>
  <rect x="316" y="78" width="26" height="40" rx="3" fill="#ffffff" stroke="#c8102e" stroke-width="2.5"/>
  <line x1="329" y1="66" x2="329" y2="78" stroke="#c8102e" stroke-width="2.5"/>
  <line x1="329" y1="118" x2="329" y2="150" stroke="#c8102e" stroke-width="2.5"/>
  <rect x="376" y="78" width="26" height="40" rx="3" fill="#ffffff" stroke="#c8102e" stroke-width="2.5"/>
  <line x1="389" y1="66" x2="389" y2="78" stroke="#c8102e" stroke-width="2.5"/>
  <path d="M389 118 V144 A 7 7 0 0 1 389 158 V186" fill="none" stroke="#c8102e" stroke-width="2.5"/>
  <text x="414" y="104" fill="#c8102e" font-size="13" font-weight="700">pull-ups 4,7 k&#8486;</text>
  <text x="414" y="122" fill="#c8102e" font-size="12">um por linha &#8212; obrigatórios</text>

  <!-- Dispositivos -->
  <g>
    <rect x="300" y="268" width="132" height="86" rx="8" fill="#ffffff" stroke="#14161a" stroke-width="2.5"/>
    <text x="366" y="296" text-anchor="middle" fill="#14161a" font-size="15" font-weight="700">Display OLED</text>
    <text x="366" y="318" text-anchor="middle" fill="#5b6270" font-size="13">SSD1306</text>
    <text x="366" y="342" text-anchor="middle" fill="#1f8a4c" font-size="14" font-weight="700">0x3C</text>
    <line x1="334" y1="150" x2="334" y2="268" stroke="#14161a" stroke-width="2"/>
    <line x1="398" y1="186" x2="398" y2="268" stroke="#14161a" stroke-width="2"/>
    <circle cx="334" cy="150" r="5" fill="#14161a"/>
    <circle cx="398" cy="186" r="5" fill="#14161a"/>
  </g>

  <g>
    <rect x="490" y="268" width="132" height="86" rx="8" fill="#ffffff" stroke="#14161a" stroke-width="2.5"/>
    <text x="556" y="296" text-anchor="middle" fill="#14161a" font-size="15" font-weight="700">Acelerômetro</text>
    <text x="556" y="318" text-anchor="middle" fill="#5b6270" font-size="13">MPU6050</text>
    <text x="556" y="342" text-anchor="middle" fill="#1f8a4c" font-size="14" font-weight="700">0x68</text>
    <line x1="524" y1="150" x2="524" y2="268" stroke="#14161a" stroke-width="2"/>
    <line x1="588" y1="186" x2="588" y2="268" stroke="#14161a" stroke-width="2"/>
    <circle cx="524" cy="150" r="5" fill="#14161a"/>
    <circle cx="588" cy="186" r="5" fill="#14161a"/>
  </g>

  <g>
    <rect x="680" y="268" width="132" height="86" rx="8" fill="#ffffff" stroke="#14161a" stroke-width="2.5"/>
    <text x="746" y="296" text-anchor="middle" fill="#14161a" font-size="15" font-weight="700">Barômetro</text>
    <text x="746" y="318" text-anchor="middle" fill="#5b6270" font-size="13">BMP280</text>
    <text x="746" y="342" text-anchor="middle" fill="#1f8a4c" font-size="14" font-weight="700">0x76</text>
    <line x1="714" y1="150" x2="714" y2="268" stroke="#14161a" stroke-width="2"/>
    <line x1="778" y1="186" x2="778" y2="268" stroke="#14161a" stroke-width="2"/>
    <circle cx="714" cy="150" r="5" fill="#14161a"/>
    <circle cx="778" cy="186" r="5" fill="#14161a"/>
  </g>

  <text x="30" y="390" fill="#5b6270" font-size="14">Todos compartilham o mesmo par de fios. O mestre chama pelo endereço e só o dispositivo chamado responde.</text>
  <text x="30" y="410" fill="#5b6270" font-size="14">Dois dispositivos com o mesmo endereço no mesmo barramento entram em conflito.</text>
</svg>
