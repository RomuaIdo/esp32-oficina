<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="30" y="30" fill="#14161a" font-size="18" font-weight="700">Qual tecnologia usar no seu projeto</text>

  <defs>
    <marker id="dt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6270"/>
    </marker>
  </defs>

  <!-- ===== P1 ===== -->
  <rect x="266" y="52" width="348" height="52" rx="26" fill="#14161a"/>
  <text x="440" y="84" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Quem precisa receber o dado?</text>

  <!-- ramo 1: celular -->
  <path d="M310 104 V 128 H 150 V 152" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#dt)"/>
  <text x="150" y="124" text-anchor="middle" fill="#5b6270" font-size="12" font-weight="700">uma pessoa, por perto</text>

  <rect x="36" y="156" width="228" height="86" rx="8" fill="#e7f9ef" stroke="#1f8a4c" stroke-width="2.5"/>
  <text x="150" y="184" text-anchor="middle" fill="#14161a" font-size="16" font-weight="700">BLE</text>
  <text x="150" y="206" text-anchor="middle" fill="#5b6270" font-size="12">celular lê e configura</text>
  <text x="150" y="226" text-anchor="middle" fill="#5b6270" font-size="12">sem rede nenhuma</text>

  <!-- ramo 2: outras placas -->
  <path d="M440 104 V 152" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#dt)"/>
  <rect x="382" y="112" width="116" height="18" fill="#ffffff"/>
  <text x="440" y="125" text-anchor="middle" fill="#5b6270" font-size="12" font-weight="700">outras placas</text>

  <rect x="326" y="156" width="228" height="86" rx="8" fill="#e7f9ef" stroke="#1f8a4c" stroke-width="2.5"/>
  <text x="440" y="184" text-anchor="middle" fill="#14161a" font-size="16" font-weight="700">ESP-NOW</text>
  <text x="440" y="206" text-anchor="middle" fill="#5b6270" font-size="12">direto, sem roteador</text>
  <text x="440" y="226" text-anchor="middle" fill="#5b6270" font-size="12">baixa latência, baixo consumo</text>

  <!-- ramo 3: internet -->
  <path d="M570 104 V 128 H 730 V 152" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#dt)"/>
  <text x="730" y="124" text-anchor="middle" fill="#5b6270" font-size="12" font-weight="700">um painel ou a internet</text>

  <rect x="616" y="156" width="228" height="52" rx="26" fill="#14161a"/>
  <text x="730" y="188" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Existe roteador confiável?</text>

  <path d="M680 208 V 232 H 633 V 254" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#dt)"/>
  <text x="604" y="228" text-anchor="middle" fill="#1f8a4c" font-size="12" font-weight="700">sim</text>

  <rect x="540" y="258" width="186" height="78" rx="8" fill="#e7f9ef" stroke="#1f8a4c" stroke-width="2.5"/>
  <text x="633" y="284" text-anchor="middle" fill="#14161a" font-size="15" font-weight="700">Wi-Fi + MQTT</text>
  <text x="633" y="304" text-anchor="middle" fill="#5b6270" font-size="12">vários nós e painéis</text>
  <text x="633" y="322" text-anchor="middle" fill="#5b6270" font-size="12">ou servidor web, se for 1 placa</text>

  <path d="M786 208 V 232 H 800 V 254" fill="none" stroke="#5b6270" stroke-width="2" marker-end="url(#dt)"/>
  <text x="838" y="228" text-anchor="middle" fill="#c8102e" font-size="12" font-weight="700">não</text>

  <rect x="748" y="258" width="110" height="78" rx="8" fill="#fffbe8" stroke="#f5c400" stroke-width="2.5"/>
  <text x="802" y="284" text-anchor="middle" fill="#14161a" font-size="15" font-weight="700">modo AP</text>
  <text x="802" y="304" text-anchor="middle" fill="#5b6270" font-size="12">a placa vira</text>
  <text x="802" y="320" text-anchor="middle" fill="#5b6270" font-size="12">a própria rede</text>

  <!-- ===== Nota final ===== -->
  <rect x="36" y="366" width="808" height="80" rx="8" fill="#f7f8fa" stroke="#c9cdd6" stroke-width="2"/>
  <text x="58" y="394" fill="#14161a" font-size="14" font-weight="700">Muitos nós espalhados E um painel na internet? Não escolha: combine.</text>
  <text x="58" y="418" fill="#5b6270" font-size="13">Os nós falam ESP-NOW com um gateway, e só o gateway usa Wi-Fi. É a arquitetura do slide anterior,</text>
  <text x="58" y="436" fill="#5b6270" font-size="13">e serve para quase todo projeto de sensoriamento distribuído.</text>
</svg>
